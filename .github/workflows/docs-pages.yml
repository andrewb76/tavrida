name: Docs (GitHub Pages)

# Требуется один раз: Settings → Pages → Source: GitHub Actions
# https://github.com/andrewb76/tavrida/settings/pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.20.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild

      - name: Build static docs
        run: pnpm docs:build
        env:
          # Project site: https://<org>.github.io/<repo>/
          VITEPRESS_BASE: /${{ github.event.repository.name }}/

      - name: Verify key pages in dist
        run: |
          dist=apps/docs-site/.vitepress/dist
          test -f "$dist/index.html"
          test -f "$dist/11-ux-ui/screen-tree.html"
          test -f "$dist/00-meta/DOCS-ROADMAP.html"
          echo "OK: index, screen-tree, DOCS-ROADMAP"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/docs-site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
