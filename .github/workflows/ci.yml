name: CI

on:
  pull_request:
  push:
    # master = mainline; dev = long-lived Sonar branch + pre-prod
    branches: [master, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.13.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild @nestjs/core core-js

      - name: Security audit
        run: |
          set +e
          out="$(pnpm audit --audit-level=high 2>&1)"
          ec=$?
          printf '%s\n' "$out"
          if [[ $ec -ne 0 ]] && printf '%s\n' "$out" | grep -q 'ERR_PNPM_AUDIT_BAD_RESPONSE'; then
            echo "::warning::pnpm audit registry payload unreadable; retrying once"
            sleep 5
            pnpm audit --audit-level=high
            exit $?
          fi
          exit $ec

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.13.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild @nestjs/core core-js

      # --continue: collect JUnit from as many packages as possible even if one fails
      - name: Test
        run: pnpm exec turbo run test --continue

      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-test-results
          path: '**/test-results/junit.xml'
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Test Results
        id: test-results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: |
            **/test-results/junit.xml
          check_name: Test Results
          comment_mode: ${{ github.event_name == 'pull_request' && 'always' || 'off' }}

      # Badge from JSON output — see marketplace «Create a badge from test results»
      - name: Set badge color
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        shell: bash
        run: |
          case ${{ fromJSON(steps['test-results'].outputs.json).conclusion }} in
            success)
              echo "BADGE_COLOR=31c653" >> "$GITHUB_ENV"
              ;;
            failure)
              echo "BADGE_COLOR=800000" >> "$GITHUB_ENV"
              ;;
            *)
              echo "BADGE_COLOR=696969" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Create badge
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        uses: emibcn/badge-action@f9150fde070fcca0c4e832437611b44838fcd325 # v2.0.4
        with:
          label: Tests
          status: >-
            ${{ fromJSON(steps['test-results'].outputs.json).formatted.stats.tests }}
            tests,
            ${{ fromJSON(steps['test-results'].outputs.json).formatted.stats.runs }}
            runs:
            ${{ fromJSON(steps['test-results'].outputs.json).conclusion }}
          color: ${{ env.BADGE_COLOR }}
          path: badge.svg

      - name: Stage badge for publish
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        run: |
          mkdir -p badge-publish
          cp badge.svg badge-publish/badge.svg

      # Host SVG on orphan branch `badges` (same idea as marketplace gist upload; no GIST_TOKEN)
      - name: Publish badge branch
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badge-publish
          publish_branch: badges
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'chore: update test results badge'

  build:
    name: Build (turbo)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.13.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild @nestjs/core core-js

      - name: Build frontend
        run: pnpm exec turbo run build --filter=@tavrida/frontend

      - name: Build docs (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm docs:build
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/

  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    # Enable: repo Variables SONAR_ORGANIZATION + SONAR_PROJECT_KEY (+ secret SONAR_TOKEN)
    # Note: `secrets` is NOT allowed in job-level `if` (Invalid workflow / Unrecognized named-value).
    # Empty token is handled in a step below (Dependabot needs SONAR_TOKEN under Dependabot secrets).
    if: ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
    needs: [lint]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Check SONAR_TOKEN
        id: sonar_token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN empty — skip scan (repo secret or Dependabot secret)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # PR decoration: action reads GITHUB_EVENT. Push to master/dev → branch analysis
      # (dev is long-lived via sonar.branch.longLivedBranches.regex on SonarCloud).
      - name: Official SonarQube Scan
        if: ${{ steps.sonar_token.outputs.skip != 'true' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SonarCloud default; for SonarQube Server set repo Variable SONAR_HOST_URL
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
