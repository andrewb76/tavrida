name: Deploy dev (Swarm)

# Build → GHCR → docker stack deploy via SSH Docker context.
# App secrets are NOT touched here — use workflow "Sync secrets (dev)" when rotating.

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: 'Image tag (empty = short GITHUB_SHA)'
        required: false
        type: string
      skip_build:
        description: 'Skip build/push (deploy existing tag only)'
        required: false
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - 'services/**'
      - 'apps/frontend/**'
      - 'packages/**'
      - 'config/**'
      - 'docker/**'
      - '.github/workflows/deploy-dev.yml'

concurrency:
  # Share with Sync secrets — avoid concurrent secret rebind vs stack deploy.
  group: swarm-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# Do NOT set DOCKER_CONTEXT globally — build/login on the runner must use the
# default context. Remote Swarm context is created later and only used for deploy.

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # On push: exact SHA. On manual run: always tip of `dev` (UI often defaults to master,
      # whose stack files still have compose `name:` rejected by `docker stack deploy`).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'dev' }}

      - name: Show checkout revision
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "short=$(git rev-parse --short HEAD)"
          git log -1 --oneline
          # Guard: broken intermediate commit referenced keto_config without _v2
          if grep -n 'source: keto_config$' docker/swarm/stack-infra.dev.yml; then
            echo "::error::stack-infra still references keto_config (need keto_config_v2). Do not Re-run an old job — Run workflow from latest dev."
            exit 1
          fi

      - name: Resolve image tag
        id: tag
        env:
          INPUT_SHA: ${{ inputs.git_sha }}
        run: |
          if [[ -n "${INPUT_SHA}" ]]; then
            echo "git_sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "git_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Environment vars
        id: envcheck
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          DEV_SWARM_SSH_HOST: ${{ vars.DEV_SWARM_SSH_HOST }}
          DEV_SWARM_SSH_USER: ${{ vars.DEV_SWARM_SSH_USER }}
        run: |
          missing=()
          [[ -z "${DEV_DOMAIN}" ]] && missing+=(DEV_DOMAIN)
          [[ -z "${ACME_EMAIL}" ]] && missing+=(ACME_EMAIL)
          [[ -z "${DEV_SWARM_SSH_HOST}" ]] && missing+=(DEV_SWARM_SSH_HOST)
          [[ -z "${DEV_SWARM_SSH_USER}" ]] && missing+=(DEV_SWARM_SSH_USER)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo "GitHub Environment \`dev\` missing: \`${missing[*]}\`"
              echo "See [github-actions.md](docs/04-deployment/github-actions.md)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Deploy skipped — configure Environment 'dev' vars: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write public dev.env
        if: steps.envcheck.outputs.ready == 'true'
        env:
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          TAVRIDA_REPO_ROOT: ${{ vars.TAVRIDA_REPO_ROOT || '/opt/tavrida' }}
          GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
          GIT_SHA: ${{ steps.tag.outputs.git_sha }}
          LOGTO_ENDPOINT: ${{ vars.LOGTO_ENDPOINT }}
          LOGTO_JWKS_URL: ${{ vars.LOGTO_JWKS_URL }}
          LOGTO_AUDIENCE: ${{ vars.LOGTO_AUDIENCE }}
          LOGTO_M2M_APP_ID: ${{ vars.LOGTO_M2M_APP_ID }}
          LOGTO_M2M_RESOURCE: ${{ vars.LOGTO_M2M_RESOURCE }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          VITE_LOGTO_ENDPOINT: ${{ vars.VITE_LOGTO_ENDPOINT }}
          VITE_LOGTO_APP_ID: ${{ vars.VITE_LOGTO_APP_ID }}
          VITE_LOGTO_API_RESOURCE: ${{ vars.VITE_LOGTO_API_RESOURCE }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ vars.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${{ vars.GRAFANA_CLOUD_PROMETHEUS_USERNAME }}
          GRAFANA_CLOUD_LOKI_URL: ${{ vars.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USERNAME: ${{ vars.GRAFANA_CLOUD_LOKI_USERNAME }}
          GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ vars.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          GRAFANA_CLOUD_OTLP_INSTANCE_ID: ${{ vars.GRAFANA_CLOUD_OTLP_INSTANCE_ID }}
        run: ./docker/swarm/ci-write-dev-env.sh

      - name: Log in to GHCR
        if: ${{ steps.envcheck.outputs.ready == 'true' && (github.event_name == 'push' || inputs.skip_build != true) }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ steps.envcheck.outputs.ready == 'true' && (github.event_name == 'push' || inputs.skip_build != true) }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prune BuildKit cache
        if: ${{ steps.envcheck.outputs.ready == 'true' && (github.event_name == 'push' || inputs.skip_build != true) }}
        run: docker buildx prune -f --filter type=regular

      - name: Build and push images
        if: ${{ steps.envcheck.outputs.ready == 'true' && (github.event_name == 'push' || inputs.skip_build != true) }}
        env:
          GHCR_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
          GIT_SHA: ${{ steps.tag.outputs.git_sha }}
          DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
          VITE_LOGTO_ENDPOINT: ${{ vars.VITE_LOGTO_ENDPOINT }}
          VITE_LOGTO_APP_ID: ${{ vars.VITE_LOGTO_APP_ID }}
          VITE_LOGTO_API_RESOURCE: ${{ vars.VITE_LOGTO_API_RESOURCE }}
        run: ./docker/swarm/build-images.sh --push

      - name: Start SSH agent
        if: steps.envcheck.outputs.ready == 'true'
        env:
          DEV_SWARM_SSH_KEY: ${{ secrets.DEV_SWARM_SSH_KEY }}
        run: ./docker/swarm/ci-ssh-agent.sh

      - name: Docker context → Swarm
        if: steps.envcheck.outputs.ready == 'true'
        env:
          DEV_SWARM_SSH_HOST: ${{ vars.DEV_SWARM_SSH_HOST }}
          DEV_SWARM_SSH_USER: ${{ vars.DEV_SWARM_SSH_USER }}
          DEV_SWARM_CONTEXT: dev-swarm
        run: ./docker/swarm/ci-docker-context.sh

      - name: Ensure Swarm secrets (create missing)
        if: steps.envcheck.outputs.ready == 'true'
        timeout-minutes: 8
        env:
          DOCKER_CONTEXT: dev-swarm
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          LOGTO_M2M_APP_SECRET: ${{ secrets.LOGTO_M2M_APP_SECRET }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
        run: |
          {
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}"
            echo "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}"
            echo "LOGTO_M2M_APP_SECRET=${LOGTO_M2M_APP_SECRET}"
            echo "INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}"
            echo "GRAFANA_CLOUD_TOKEN=${GRAFANA_CLOUD_TOKEN}"
          } > docker/swarm/dev.secrets.env
          # create-missing only — must not scan all services (that hammers SSH).
          DOCKER_CONTEXT=dev-swarm ./docker/swarm/sync-secrets-dev.sh

      - name: Registry auth on context (for --with-registry-auth)
        if: steps.envcheck.outputs.ready == 'true'
        env:
          DOCKER_CONTEXT: dev-swarm
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker --context "$DOCKER_CONTEXT" login ghcr.io \
            -u "$GHCR_USER" --password-stdin

      # Pull on the VPS over SSH (not via docker.sock tunnel) so long sequential
      # pulls do not die with the tunnel. Login on the node with GITHUB_TOKEN.
      # continue-on-error: stack deploy still has --with-registry-auth; pre-pull is
      # best-effort warmth (skip-if-present + parallel). Soft-fail beats skipped deploy.
      - name: Pre-pull images on Swarm node
        id: prepull
        if: steps.envcheck.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 40
        env:
          DOCKER_CONTEXT: dev-swarm
          DEV_SWARM_SSH_HOST: ${{ vars.DEV_SWARM_SSH_HOST }}
          DEV_SWARM_SSH_USER: ${{ vars.DEV_SWARM_SSH_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./docker/swarm/ci-prepull-images.sh

      - name: Stack deploy
        if: steps.envcheck.outputs.ready == 'true'
        timeout-minutes: 25
        env:
          DOCKER_CONTEXT: dev-swarm
          # Pre-pull warmed GHCR tags on the node — skip manager registry resolve.
          PREPULL_OK: ${{ steps.prepull.outcome == 'success' && '1' || '0' }}
          STACK_DEPLOY_RETRIES: '12'
        run: |
          if [[ "${{ steps.prepull.outcome }}" != "success" ]]; then
            echo "::warning::Pre-pull did not fully succeed (outcome=${{ steps.prepull.outcome }}) — deploying with resolve-image=changed + --with-registry-auth."
          else
            echo "Pre-pull ok — stack deploy will use --resolve-image never."
          fi
          ./docker/swarm/deploy-dev.sh

      - name: Summary
        if: steps.envcheck.outputs.ready == 'true'
        run: |
          {
            echo "### Dev deploy"
            echo "- tag: \`${{ steps.tag.outputs.git_sha }}\`"
            echo "- app: https://app.${{ vars.DEV_DOMAIN }}"
            echo "- api: https://api.${{ vars.DEV_DOMAIN }}/api/v1"
          } >> "$GITHUB_STEP_SUMMARY"
