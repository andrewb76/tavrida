# SonarQube Cloud / Server — analysis scope for Tavrida Lot monorepo.
# Organization + projectKey are passed from CI (-Dsonar.* / GitHub vars).
# Docs: docs/04-deployment/github-actions.md § SonarQube

sonar.projectName=Tavrida Lot
sonar.sourceEncoding=UTF-8

# Application / library TypeScript (Nest + Vue + packages)
sonar.sources=apps,services,packages
sonar.tests=apps,services,packages
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/dist-test/**,\
**/.turbo/**,\
**/.vite/**,\
**/coverage/**,\
**/test-results/**,\
**/*.min.js,\
apps/docs-site/**,\
apps/frontend/dist/**,\
docker/**,\
docs/**

sonar.coverage.exclusions=\
**/*.test.ts,\
**/*.spec.ts,\
**/main.ts,\
**/hydrate-secrets.ts,\
apps/frontend/src/sentry.ts
