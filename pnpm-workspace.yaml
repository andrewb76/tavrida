packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

overrides:
  lodash: '>=4.18.1'
  multer: '>=2.2.0'
  qs: '>=6.15.2'
  vite: '>=6.4.3'
  file-type: '>=21.3.2'
  uuid: '>=11.1.1'
  # brace-expansion: do NOT force 5.0.8 — ESM-only releases break minimatch CJS
  # (`brace_expansion_1.default is not a function` → TypeORM glob crash in Nest).
  # Pin CJS-compatible patched lines (CVE-2026-33750 / related advisories).
  'brace-expansion@<2.1.0': '2.0.3'
  'brace-expansion@>=5': '5.0.5'
  # GHSA-r28c-9q8g-f849 — sourceMappingURL path traversal
  postcss: '>=8.5.18'

# GHSA-mh99 / GHSA-3jxr claim patched only >=5.0.8, but that line is ESM-only and
# breaks Nest/TypeORM at runtime. We keep CJS-safe 2.0.3 / 5.0.5 and ignore those
# advisories until minimatch ships a compatible consumer.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    - GHSA-3jxr-9vmj-r5cp

allowBuilds:
  '@nestjs/core': true
  core-js: true
  esbuild: true
  vue-demi: false
