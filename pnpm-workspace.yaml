packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'e2e'

overrides:
  lodash: '>=4.18.1'
  multer: '>=2.2.0'
  qs: '>=6.15.2'
  vite: '>=6.4.3'
  file-type: '>=21.3.2'
  uuid: '>=11.1.1'
  # brace-expansion: CVE-2026-14257 / CVE-2026-59870
  # 5.0.9+ and 2.1.4+ are patched; test CJS compat before upgrading
  'brace-expansion@<2.1.0': '2.1.4'
  'brace-expansion@>=5': '5.0.9'
  # GHSA-r28c-9q8g-f849 — sourceMappingURL path traversal
  postcss: '>=8.5.23'
  # GHSA-2rp8-mm9q-fp49 — TypeORM migration:generate template-literal code injection
  typeorm: '>=0.3.31'
  # CVE-2026-59870 — js-yaml !!omap DoS
  js-yaml: '>=4.3.1'
  # GHSA-2v37-7h3g-55p8 — nanoid zero-size infinite loop
  nanoid: '>=3.3.17'

# GHSA-mh99 / GHSA-3jxr — brace-expansion DoS; overridden to patched 2.1.4 / 5.0.9.
# If CJS breakage observed, revert overrides and add GHSA IDs to ignoreGhsas.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    - GHSA-3jxr-9vmj-r5cp

allowBuilds:
  '@nestjs/core': true
  core-js: true
  esbuild: true
  vue-demi: false
