packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

overrides:
  lodash: '>=4.18.1'
  multer: '>=2.2.0'
  qs: '>=6.15.2'
  vite: '>=6.4.3'
  file-type: '>=21.3.2'
  uuid: '>=11.1.1'
  # GHSA-mh99-v99m-4gvg (and prior GHSA-3jxr-9vmj-r5cp): advisory range is <=5.0.7,
  # patched only >=5.0.8 — force single patched line for all consumers.
  brace-expansion: '5.0.8'
  # GHSA-r28c-9q8g-f849 — sourceMappingURL path traversal
  postcss: '>=8.5.18'

allowBuilds:
  '@nestjs/core': true
  core-js: true
  esbuild: true
  vue-demi: false
